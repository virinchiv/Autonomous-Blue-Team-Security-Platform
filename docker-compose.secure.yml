version: '3.7'

# Secure profile enabling Elasticsearch security with a password
# and Kibana configured to authenticate to Elasticsearch.
# Usage:
#   ELASTIC_PASSWORD=changeme docker compose -f docker-compose.secure.yml up -d
# Then set ELASTICSEARCH_USERNAME and ELASTICSEARCH_PASSWORD in your .env for AION and Filebeat.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: elasticsearch-secure
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    ports:
      - "9200:9200"
    networks:
      - elastic-secure

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.0
    container_name: kibana-secure
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    ports:
      - "5601:5601"
    networks:
      - elastic-secure

networks:
  elastic-secure:
    driver: bridge
