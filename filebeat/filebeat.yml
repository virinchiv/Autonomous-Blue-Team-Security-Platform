#============================= Filebeat modules ===============================
filebeat.modules:
  - module: apache
    access:
      enabled: true
      var.paths: ["/var/log/apache2/access.log*", "/var/log/httpd/access_log*"]
    error:
      enabled: true
      var.paths: ["/var/log/apache2/error.log*", "/var/log/httpd/error_log*"]

  - module: nginx
    access:
      enabled: true
      var.paths: ["/var/log/nginx/access.log*"]
    error:
      enabled: false

  - module: system
    syslog:
      enabled: true
      var.paths: ["/var/log/syslog", "/var/log/messages"]
    auth:
      enabled: true
      var.paths: ["/var/log/auth.log", "/var/log/secure"]

#=========================== Processors ======================================
processors:
  - add_fields:
      target: aion
      fields:
        status: pending
  - add_host_metadata: ~
  - add_cloud_metadata: ~
  - add_docker_metadata: ~

#============================= Output ========================================
output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOSTS:http://localhost:9200}"]
  # If security is enabled on Elasticsearch, set credentials via env vars
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}
  # Send all events to a single index so AION can monitor one place
  index: unified-logs

# Ensure the index exists and has mappings. Let Elasticsearch handle dynamic mapping for MVP.
setup.template.enabled: true
setup.template.overwrite: false
setup.template.name: "unified-logs"
setup.template.pattern: "unified-logs*"

#============================= Logging =======================================
logging.level: info
logging.to_files: true
logging.files:
  rotateeverybytes: 10485760
